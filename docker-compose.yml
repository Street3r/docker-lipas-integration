# Lipas -> TAK integration: generator + file distribution (+ feeders later)
#
# Usage:
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# The generator runs weekly at LIPAS2TAK_SCHEDULE_AT (default Monday 04:00
# Finnish time). On start it runs at once only if a scheduled run was missed.

# By default the prebuilt public image from ghcr is used. Update:
#   docker compose pull && docker compose up -d
# Local build instead: LIPAS2TAK_IMAGE=lipas2tak:local in .env, a clone in
# ../python-lipas2tak-tool and `docker compose build generator`.
x-lipas2tak-image: &lipas2tak-image
  image: ${LIPAS2TAK_IMAGE:-ghcr.io/street3r/python-lipas2tak-tool:main}
  build: ${LIPAS2TAK_BUILD_CONTEXT:-../python-lipas2tak-tool}

services:
  generator:
    <<: *lipas2tak-image
    restart: unless-stopped
    environment:
      LIPAS2TAK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Custom icon set: see .env.example and icons/README.md
      LIPAS2TAK_ICONS_DIR: ${LIPAS2TAK_ICONS_DIR:-}
    command: ["schedule", "--at", "${LIPAS2TAK_SCHEDULE_AT:-mon 04:00}", "--tz", "${LIPAS2TAK_TZ:-Europe/Helsinki}",
              "--dump", "/data/raw"]
    volumes:
      - lipas2tak-data:/data
      - ./icons:/app/icons/custom:ro

  web:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"   # TLS is handled by the server's reverse proxy
    volumes:
      - lipas2tak-data:/data:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [generator]

  # Publisher: builds a public version (own icon set, public URL) after every
  # generator run and pushes it to a git branch served by GitHub Pages.
  # Enabled only with the "github" profile: COMPOSE_PROFILES=github in .env.
  publisher:
    <<: *lipas2tak-image
    profiles: ["github"]
    restart: unless-stopped
    environment:
      PUBLISH_REPO: ${PUBLISH_REPO:-git@github.com:Street3r/finland-outdoor-tak-data.git}
      PUBLISH_BRANCH: ${PUBLISH_BRANCH:-data}
      PUBLISH_BASE_URL: ${PUBLISH_BASE_URL:-https://street3r.github.io/finland-outdoor-tak-data}
      GIT_SSH_COMMAND: >-
        ssh -i /run/secrets/deploy_key -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/data/publish/known_hosts
        -o ServerAliveInterval=30 -o ServerAliveCountMax=10
    command: ["publish", "--raw", "/data/raw", "--workdir", "/data/publish",
              "--watch", "/data/output/index.json", "--interval", "600"]
    volumes:
      - lipas2tak-data:/data
      - ${PUBLISH_DEPLOY_KEY:-./secrets/github_deploy_key}:/run/secrets/deploy_key:ro
    depends_on: [generator]

  # Feeders (planned): one container per TAK Server / group / certificate.
  # feeder-kansallispuistot:
  #   <<: *lipas2tak-image
  #   command: ["feed", "--config", "/feeders/kansallispuistot.yaml"]
  #   volumes:
  #     - lipas2tak-data:/data:ro
  #     - ./feeders:/feeders:ro
  #     - ./certs/kansallispuistot:/certs:ro

volumes:
  lipas2tak-data:
