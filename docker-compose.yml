# Lipas -> TAK integration: generator + file distribution (+ feeders later)
#
# Usage:
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# The generator runs immediately on start and then every LIPAS2TAK_EVERY_DAYS days.

# By default the image is built locally from the sibling clone:
#   git clone https://github.com/Street3r/python-lipas2tak-tool ../python-lipas2tak-tool
# A prebuilt image can be enabled in .env (LIPAS2TAK_IMAGE=ghcr.io/...).
x-lipas2tak-image: &lipas2tak-image
  image: ${LIPAS2TAK_IMAGE:-lipas2tak:local}
  build: ${LIPAS2TAK_BUILD_CONTEXT:-../python-lipas2tak-tool}

services:
  generator:
    <<: *lipas2tak-image
    restart: unless-stopped
    environment:
      LIPAS2TAK_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Custom icon set: see .env.example and icons/README.md
      LIPAS2TAK_ICONS_DIR: ${LIPAS2TAK_ICONS_DIR:-}
    command: ["schedule", "--every-days", "${LIPAS2TAK_EVERY_DAYS:-7}", "--dump", "/data/raw"]
    volumes:
      - lipas2tak-data:/data
      - ./icons:/app/icons/custom:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"   # TLS is handled by the server's reverse proxy
    volumes:
      - lipas2tak-data:/data:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [generator]

  # Feeders (planned): one container per TAK Server / group / certificate.
  # feeder-kansallispuistot:
  #   <<: *lipas2tak-image
  #   command: ["feed", "--config", "/feeders/kansallispuistot.yaml"]
  #   volumes:
  #     - lipas2tak-data:/data:ro
  #     - ./feeders:/feeders:ro
  #     - ./certs/kansallispuistot:/certs:ro

volumes:
  lipas2tak-data:
